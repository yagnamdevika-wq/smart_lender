<!DOCTYPE html>
<html>
<head>
    <title>Decision Status</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #ffaa66; margin-top: 100px; }
        .card { background: white; padding: 40px; display: inline-block; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.2); }
        h1 { color: #333; }
        .result { font-size: 26px; font-weight: bold; color: #d32f2f; margin: 20px 0; }
        .btn { display: inline-block; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Loan Approval Prediction Result</h1>
        <div class="result">{{ result }}</div>
        <a href="/" class="btn">Check Another Profile</a>
    </div>
</body>
</html>
